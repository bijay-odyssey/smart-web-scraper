spec_version: 0

id: smart-web-scraper
root: E:\myScrapper
summary: >
  Searches the live web for a query and returns a synthesized, cited answer
  built from real page content (not a link list), via a tiered chain of
  search backends and Groq for synthesis.

kind: capability
transport: python

# ---------------------------------------------------------------- lifecycle
# There's no server process to start/stop -- transport: python means the
# capability runs synchronously inside the caller's own process. start.sh /
# start.bat exist in this repo, but they set up the *demo CLI* environment
# (venv, deps, .env), they don't launch anything the secretary would import
# against. For the secretary to import search_agent.tool directly, this
# project's dependencies (see requirements.txt) need to be installed in
# whatever Python environment the secretary runs in -- either by running the
# secretary inside this project's .venv, or by installing requirements.txt
# into the secretary's own environment. There's no manifest field for that;
# flagging it here since it's a real precondition, not an assumption.
lifecycle:
  start: null
  start_sh: null
  stop: null
  stop_sh: null
  requires: [python]
  port_env: null
  default_port: null
  assigned_port: null
  boot_timeout_s: null
  health: null              # no running service to health-check

# --------------------------------------------------------------------- auth
auth:
  kind: none                # nothing authenticates *to* this capability;
  header: null               # the API keys below are this project's own
  env: null                  # outbound auth to Groq/Tavily/Brave, not inbound

# ---------------------------------------------------------------------- env
env:
  required:
    - name: GROQ_API_KEY
      why: answer synthesis (every call ends in one Groq chat-completion request)
      where: .env
  optional:
    - name: TAVILY_API_KEY
      why: >
        Primary search backend when set. Materially better than the
        scraping fallback -- confirmed live, not assumed: fixed both a hard
        DuckDuckGo rate-limit failure and a relevance failure (Bing's
        unauthenticated results returned "Best Buy" and a dictionary
        definition for a query about free LLM tools) that scraping alone
        could not fix. Free tier: 1,000 searches/month.
      where: .env
    - name: BRAVE_API_KEY
      why: >
        Second-tier real search API, tried if Tavily is unset or fails.
        Without EITHER key, search runs entirely on free DuckDuckGo/Bing
        scraping, which is measurably less reliable (see limits) and lower
        quality on long natural-language queries specifically. Free tier:
        2,000 queries/month.
      where: .env

# ---------------------------------------------------------- discovery
discovery:
  openapi: null                    # not a web service
  live_capabilities: null          # no such endpoint; TOOL_SCHEMA (below) is
                                    # the schema source of truth instead

# ------------------------------------------------------------- capabilities
capabilities:
  - id: search.web
    verb: search
    summary: >
      Search the live web for a query and return a synthesized, cited
      answer with source URLs, or a structured error code if it couldn't
      (see README.md#machine-interface for the full failure-mode table).
    consumes: application/json     # {query: str, num_results?: int}
    produces: application/json     # {query, answer, sources[]} + optional "error"

    python: {module: search_agent.tool, function: execute_tool_call}
    # execute_tool_call(function_name, arguments) is the stable entry point.
    # TOOL_SCHEMA in the same module is the OpenAI-style function schema
    # (name "web_search", params {query: required string, num_results:
    # optional int}) -- register it directly in a tools=[...] list.

    schema_ref: search_agent.tool.TOOL_SCHEMA
    example: examples/agent_example.py
    side_effects: [network, costs_quota]
    # Also writes to disk: search_agent/cache.py opens a diskcache store at
    # <root>/.cache/ (cache.db + -shm/-wal) -- created immediately on import
    # of search_agent.tool, not lazily on first search. Not flagged as
    # writes_disk above per this project's explicit call that it's an
    # implementation detail (a local cache), not a side effect worth
    # steering around -- noting it here for completeness regardless.
    typical_latency_ms: 8000-31000
    # Measured, not estimated (n=3 live queries, cache disabled): 8.0s,
    # 14.9s, 30.9s. Dominated by the Groq synthesis call (isolated
    # separately: 18.4s of an 18.4s total on one run) -- search and page
    # fetch are disk-cached and near-instant on repeat (0.00s measured),
    # but synthesis is NOT cached and runs fresh on every single call,
    # cached query or not. See limits.

# -------------------------------------------------------------------- limits
limits:
  - Synthesis is never cached. The disk cache (search_agent/cache.py) speeds
    up repeat searches and repeat page fetches (both confirmed at 0.00s on
    a cache hit), but every call still makes a fresh Groq request to write
    the answer -- measured at 18.4s in isolation. A "repeat" query is not
    meaningfully faster end to end than a fresh one.
  - Without TAVILY_API_KEY or BRAVE_API_KEY, search runs entirely on free
    DuckDuckGo/Bing scraping. DuckDuckGo's HTML endpoint rate-limited this
    client during a heavy testing session (confirmed live: HTTP 202
    challenge page instead of results) and took over an hour to clear.
    Bing's unauthenticated endpoint degrades on long natural-language
    queries specifically -- confirmed live returning "Best Buy" and a
    dictionary definition of "best" for a query about free LLM tools.
    Query-rewriting and relevance re-ranking mitigate this but do not fully
    close the gap to a configured real API.
  - JS-rendered pages (React/Vue/Next.js docs and pricing pages especially)
    often return near-empty content from a plain fetch -- confirmed:
    console.groq.com returned ~480 characters of nav boilerplate via static
    GET. A Jina AI Reader fallback (r.jina.ai, free, no key) recovers most
    of these, but that is a third dependency's uptime this capability now
    also depends on.
  - Groq's free tier itself carries per-model rate limits (observed ~30
    RPM / 1,000 RPD on openai/gpt-oss-120b, the current default model) --
    sustained multi-request-per-minute secretary usage can hit these.
    Surfaces as error: synthesis_failed when it happens.
  - Model names on Groq's free tier have been deprecated mid-project once
    already (llama-3.3-70b-versatile was retired without notice this
    capability received). GROQ_MODEL may need updating if synthesis starts
    failing with a model_not_found-shaped error.
  - No automated test suite. Every behaviour documented here (including
    everything in this file) was verified by hand against live queries,
    not by a regression suite that would catch a future break.
  - Answer quality is only as good as what the search backends actually
    surface for a given phrasing -- confirmed live that the same underlying
    question can get a materially better or worse answer purely from query
    wording, independent of any bug.

# -------------------------------------------------------------------- extend
extend:
  recipe: unknown
  steps: unknown
  touches_core: false
  # This project has exactly one capability by design (web search). There's
  # no documented recipe for adding a second one because none was ever
  # built -- "unknown" per spec rule 2, not a guess at what it'd look like.

# --------------------------------------------------------------- data_policy
data_policy:
  egress: third_party_api
  egress_detail: >
    The query text goes to whichever search backend answers it (Tavily API,
    Brave Search API, or DuckDuckGo/Bing via HTTP scraping). The full text
    of every fetched source page, plus the query, goes to Groq for answer
    synthesis. If a page is JS-rendered and a plain fetch comes back too
    thin, its URL also goes to Jina AI's free Reader API (r.jina.ai) for
    server-side rendering. Four third parties can see a given query/page
    depending on which backends and fallbacks a call happens to hit.
  reads_paths: []
  # Reads only its own root: .env (config) and .cache/ (its own disk cache).
  # Does not read arbitrary paths elsewhere on the machine.
  denied_paths: []
